<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>flex box direction</title>
</head>
<body>
    <h2>Flex Box Direction</h2>

<div id="container">

<div id="box1" class="box"> flex item</div>
<div id="box2" class="box"> flex item</div>
<div id="box3" class="box"> flex item</div>
<div id="box4" class="box"> flex item</div>
<div id="box5" class="box"> flex item</div>

</div>

<style>
    #container {
        border: 2px solid rgb(231, 8, 8);
        padding: 10px;
        width: 50%;
        height: 150px;
        font-style: italic;
        box-sizing: border-box;
        display:flex;
        line-height: 100px;
        text-align: center;
        justify-content: space-evenly
    }


    #box1{
        background-color: lightcoral;
        width: 100px;
        height: 100px;
    }
    #box2{
        background-color: lightblue;
        width: 100px;
        height: 100px;
    }
    #box3{
        background-color: lightgreen;
        width: 100px;
        height: 100px;
    }
    #box4{
        background-color: lightpink;
        width: 100px;
        height: 100px;
    }
    #box5{
        background-color: lightgray;
        width: 100px;
        height: 100px;
    }

    .box{
        border: 2px solid black;
        margin: 5px;
        font-family: Arial, sans-serif;
        font-size: 16px;
        color: #df0c0c;
    }


</style>

</body>
</html>
