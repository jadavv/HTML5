<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>float property</title>
</head>
<body>

    <style>

    .container {
        width: 100%;
        height: 150px;
        border: 2px solid rgb(23, 225, 9);
        padding: 10px;
        box-sizing: border-box;
    }

    .box1 {
        width: 45%;
        height: 100px;
        background-color: lightcoral;
        float: right;
        margin: 10px;
    }

    .box2 {
        width: 45%;
        height: 100px;
        background-color: lightblue;
        float: left;
        margin: 10px;
    }

    </style>
    
<div class="container">

<div class="box1"></div>
<div class="box2"></div>

</div>

</body>
</html>
