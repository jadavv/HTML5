<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>grid</title>
    <style>
    
    #container{
        display: grid;
        grid-template-columns: auto auto auto auto;
        gap: 20px;
        background-color: lightgray;
        padding: 20px;
    }
    .item1{
        background-color: lightcoral;
        padding: 20px;
        font-size: 30px;
        text-align: center;
    }
    .item2{
        background-color: lightblue;
        padding: 20px;
        font-size: 30px;
        text-align: center;
    }
    .item3{
        background-color: lightgreen;
        padding: 20px;
        font-size: 30px;
        text-align: center;
    }
    .item4{
        background-color: lightpink;
        padding: 20px;
        font-size: 30px;
        text-align: center;
    }

    </style>
</head>
<body>
    

    <h1>Grid Layout</h1>

    <div id="container">

    <div class="item1">item1</div>
    <div class="item2">item2</div>
    <div class="item3">item3</div>
    <div class="item4">item4</div>
</div>
        
</body>
</html>
